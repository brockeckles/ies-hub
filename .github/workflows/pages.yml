name: Deploy Pages

# Actions-based Pages deployment — replaces the legacy build path, whose final
# "Deploy to GitHub Pages" step was failing on ~every push (2026-07-04),
# requiring manual POST /pages/builds re-queues. This path is retryable and
# under our control. Static site, no build step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # S7 (2026-07-28) — emit build-info AT DEPLOY TIME so it can never go
      # stale. The manual pre-push run recorded HEAD *at run time*: run it
      # before the code commit and it permanently pins the PREVIOUS sha
      # (exactly the 0242296-vs-0f0cba6 staleness shipped 2026-07-27). Here
      # HEAD is the deployed commit by construction. The committed
      # build-info.json remains as a fallback for local/offline serving.
      - name: Emit build-info
        run: bash scripts/emit-build-info.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
